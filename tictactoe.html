<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Tic Tac Toe</title>

<style>
body {
    margin: 0;
    background: #2f3b4c;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

.game {
    width: min(95vw, 1000px);
}

#status {
    text-align: center;
    color: white;
    margin-bottom: 12px;
    font-weight: bold;
    font-size: 1.2rem;
}

/* MAIN 3×3 BOARD */
.main-board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
}

/* BIG BOARD */
.big-board {
    background: #e5e7eb;
    border-radius: 14px;
    padding: 10px;
    position: relative;
    transition: outline 0.3s ease;
}

.big-board.active {
    outline: 3px solid #60a5fa;
}

.big-board.won-x::after,
.big-board.won-o::after {
    content: attr(data-winner);
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4rem;
    font-weight: bold;
    color: rgba(0,0,0,0.3);
    pointer-events: none;
    border-radius: 14px;
}

/* MINI BOARD */
.mini-board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
}

/* MINI CELL */
.cell {
    background: white;
    border-radius: 6px;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    transition: all 0.2s ease;
    border: 2px solid transparent;
}

.cell:hover:not(.played) {
    background: #f3f4f6;
    transform: scale(0.95);
}

.cell.x {
    color: #ef4444;
    font-weight: 900;
}

.cell.o {
    color: #2563eb;
    font-weight: 900;
}

.cell.played {
    cursor: not-allowed;
}

button {
    margin-top: 14px;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #4f46e5;
    color: white;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.3s ease;
    font-weight: bold;
}

button:hover {
    background: #4338ca;
}

button:active {
    transform: scale(0.98);
}
</style>
</head>

<body>
<div class="game">
    <div id="status">Player X's turn</div>
    <div class="main-board" id="mainBoard"></div>
    <button onclick="resetGame()">Reset</button>
</div>

<script>
const mainBoardEl = document.getElementById("mainBoard");
const statusEl = document.getElementById("status");

let currentPlayer = "X";
let activeBoard = -1;
let gameOver = false;

const boards = Array.from({ length: 9 }, () => Array(9).fill(""));
const boardWinners = Array(9).fill("");

const wins = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
];

function createBoard() {
    mainBoardEl.innerHTML = "";
    for (let b = 0; b < 9; b++) {
        const big = document.createElement("div");
        big.className = "big-board";
        big.dataset.index = b;

        const mini = document.createElement("div");
        mini.className = "mini-board";

        for (let c = 0; c < 9; c++) {
            const cell = document.createElement("div");
            cell.className = "cell";
            cell.onclick = () => playMove(b, c);
            mini.appendChild(cell);
        }

        big.appendChild(mini);
        mainBoardEl.appendChild(big);
    }
    updateActiveBoards();
}

function playMove(b, c) {
    if (gameOver) return;
    if (activeBoard !== -1 && activeBoard !== b) return;
    if (boards[b][c] || boardWinners[b]) return;

    boards[b][c] = currentPlayer;
    const cell = mainBoardEl.children[b].querySelectorAll(".cell")[c];
    cell.textContent = currentPlayer;
    cell.classList.add(currentPlayer.toLowerCase());
    cell.classList.add("played");

    if (checkWin(boards[b])) {
        boardWinners[b] = currentPlayer;
        const big = mainBoardEl.children[b];
        big.classList.add(`won-${currentPlayer.toLowerCase()}`);
        big.dataset.winner = currentPlayer;

        if (checkWin(boardWinners)) {
            statusEl.textContent = `🎉 Player ${currentPlayer} wins the game!`;
            gameOver = true;
            return;
        }
    }

    activeBoard = boardWinners[c] ? -1 : c;
    currentPlayer = currentPlayer === "X" ? "O" : "X";
    statusEl.textContent = `Player ${currentPlayer}'s turn`;
    updateActiveBoards();
}

function checkWin(arr) {
    return wins.some(p =>
        arr[p[0]] &&
        arr[p[0]] === arr[p[1]] &&
        arr[p[0]] === arr[p[2]]
    );
}

function updateActiveBoards() {
    [...mainBoardEl.children].forEach((b, i) => {
        b.classList.toggle(
            "active",
            !gameOver && (activeBoard === -1 || activeBoard === i) && !boardWinners[i]
        );
    });
}

function resetGame() {
    currentPlayer = "X";
    activeBoard = -1;
    gameOver = false;
    boards.forEach(b => b.fill(""));
    boardWinners.fill("");
    statusEl.textContent = "Player X's turn";
    createBoard();
}

createBoard();
</script>
</body>
</html>
